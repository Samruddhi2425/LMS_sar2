<app-navbar></app-navbar>
<!-- Spinner Overlay -->
<div *ngIf="loading" class="loading-overlay">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>
<section class="h-100">
  <div class="container h-100 py-5">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-10">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="fw-normal mb-0">Wishlist Books</h3>
        </div>

        <!-- Loop through cart items -->
        <div class="card rounded-3 mb-4" *ngFor="let cart of wishlistBooks">
          <div class="card-body p-4">
            <div class="row d-flex justify-content-between align-items-center">

              <!-- Book Image -->
              <div class="col-md-2 col-lg-2 col-xl-2">
                <img [src]="'data:image/png;base64,' + cart.base64Image"
                     class="img-fluid rounded-3"
                     alt="Book Image" />
              </div>

              <!-- Book Details -->
              <div class="col-md-3 col-lg-3 col-xl-3" style="overflow-x: auto;">
                <p class="lead fw-normal mb-2">Book name: {{ cart.bookName }}</p>
                <p>
                  <span class="text-muted">Author: {{ cart.authorName }}</span><br />
                  <span class="text-muted">Category: {{ cart.genre }}</span>
                </p>
              </div>

              <!-- Quantity Input -->
              <!-- <div class="col-md-3 col-lg-3 col-xl-2 d-flex">
                <input id="form1"
                       min="1"
                       max="3"
                       name="quantity"
                       value="1"
                       type="number"
                       class="form-control form-control-sm" />
              </div> -->

              <!-- Selection Checkbox -->
              <div class="col-md-3 col-lg-3 col-xl-2 d-flex">
                <label class="form-check-label">
                  <input type="checkbox"
                         class="form-check-input"
                         (change)="onCheckboxChange($event, cart)" />
                  Select
                </label>
              </div>

              <!-- Trash Icon (optional delete) -->
              <div class="col-md-1 col-lg-1 col-xl-1 text-end">
                <a href="javascript:void(0);" class="text-danger"
                  (click) = "deleteBookFromWishlist(cart.wishlistId)">
                  <i class="bi bi-trash" style="font-size: 1.4rem;"></i>
                </a>
              </div>

            </div>
          </div>
        </div>

        <!-- Issue Button -->
        <div class="d-flex justify-content-end my-5">
          <button class="btn btn-success"
                  type="button"
                  (click)="issueSelectedBook()">
            Issue
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
