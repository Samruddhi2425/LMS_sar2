<form (ngSubmit)="updateBook()" #bookForm="ngForm" class="book-form">

  <h2 class="form-title">📚 Update Book</h2>

  <!-- <div class="form-group">
    <label for="bookId">Book ID</label>
    <input type="number" name="bookId" id="bookId" [(ngModel)]="books.bookId" readonly required />
  </div> -->

  <div class="form-group">
    <label for="bookName">Book Name</label>
    <input type="text" name="bookName" id="bookName" [(ngModel)]="books.bookName" required />
  </div>

  <div class="form-group">
    <label for="authorName">Author</label>
    <input type="text" name="authorName" id="authorName" [(ngModel)]="books.authorName" required />
  </div>

  <div class="form-group">
    <label for="isbn">ISBN</label>
    <input type="text" name="isbn" id="isbn" [(ngModel)]="books.isbn" required />
  </div>

  <div class="form-group">
    <label for="genre">Genre</label>

    <div>
      <select class="form-control" [(ngModel)]="books.genreId" name="genr" id="genr" required>
        <option value="" disabled selected>Select a genre</option>
        <option *ngFor="let gen of category" [value]="gen.genreId">
          {{ gen.genre }}
        </option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label for="quantity">Quantity</label>
    <input type="number" name="quantity" id="quantity" [(ngModel)]="books.quantity" min="1" required />
  </div>

  <div class="form-group">
    <label for="image">Book Cover</label>
    <!-- <input type="text" name="img" id="img" [(ngModel)]="book.base64Image" required /> -->
    <div>
      <img [src]="'data:image/png;base64,' + books.base64Image" class="img-thumbnail book-img"
        class="card-img-top fixed-image" alt="Book Image">
    </div>
    <input type="file" (change)="onFileChange($event)" id="image" required />
  </div>

  <button type="submit" [disabled]="!bookForm.form.valid" class="submit-btn">
    Update Book
  </button>
</form>
