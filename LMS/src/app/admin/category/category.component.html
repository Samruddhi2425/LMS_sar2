<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4 col-lg-4">
            <fieldset class="border p-3 rounded">
                <legend class="float-none w-auto px-2">Add Genre</legend>
                <form [formGroup]="addGenreForm" (ngSubmit)="onSubmit()">
                    <!-- First Name -->
                    <div class="mb-3">
                        <label class="form-label">Genre</label>
                        <input type="text" class="form-control" id="genre" formControlName="genre"
                            aria-describedby="fnameHelp" />
                        <div class="text-danger"
                            *ngIf="addGenreForm.get('genre')?.invalid && addGenreForm.get('genre')?.touched">
                            Genre is required.
                        </div>
                        <button class="btn btn-primary w-100 my-2" type="submit" [disabled]="addGenreForm.invalid">
                        Add
                    </button>
                    </div>
                </form>
            </fieldset>
        </div>
        <div class="col-md-8 col-lg-8">
            <fieldset class="border p-3 rounded">
                <legend class="float-none w-auto px-2">Genres</legend>
                <div class="card card-custom mb-3">
                    <div class="card-header bg-dark text-white fw-bold">
                        Genres
                    </div>
                    <div class="card-body p-0 " style="height: 400px; overflow-y: auto;">
                        <table class="table table-dark-custom table-bordered m-0">
                            <thead>
                                <tr>
                                    <th>Sr No</th>
                                    <th>Genre</th>
                                    <th>Delete</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let genr of genres; index as i">
                                    <td>{{genr.genreId}}</td>
                                    <td>{{genr.genre}}</td>
                                    <td><button class="btn btn-outline-danger"
                                            (click)="deleteCategory(genr.genreId)">Delete</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </fieldset>
        </div>
    </div>
