<div class="container mt-4">
    <!-- Pending Returns Card -->

    <div class="card card-custom mb-3">
        <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
      Report
      <button class="btn btn-success" (click)="downloadPDF()">Download</button>
    </div>
        <div class="card-body p-0">
            <table class="table table-dark-custom table-bordered m-0">
                <thead>
                    <tr>
                        <th>Sr. No.</th>
                        <th>UserId</th>
                        <th>Firstname</th>
                        <th>Lastname</th>
                        <th>TotalIssueCount</th>

                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let report of reports; index as i">
                        <td>{{ i + 1 }}</td>
                        <td>{{ report.userId }}</td>
                        <td>{{ report.firstName }}</td>
                        <td>{{ report.lastName }}</td>
                        <td>{{ report.totalBooksIssued }}</td> 
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
