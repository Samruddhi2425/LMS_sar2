<fieldset class="border p-3 rounded m-5 shadow">
  <legend class="float-none w-auto px-2">User Profile</legend>
  <div class="container m-4">
    <h4></h4>

    <form *ngIf="currentUser">
      <div class="mb-3">
        <label>First Name</label>
        <input type="text" [(ngModel)]="currentUser.firstName" name="firstName" class="form-control"
          [readonly]="!isEditing" />
      </div>

      <div class="mb-3">
        <label>Last Name</label>
        <input type="text" [(ngModel)]="currentUser.lastName" name="lastName" class="form-control"
          [readonly]="!isEditing" />
      </div>

      <div class="mb-3">
        <label>Email</label>
        <input type="email" [(ngModel)]="currentUser.email" name="email" class="form-control" readonly />
      </div>

      <div class="mb-3">
        <label>Phone Number</label>
        <input type="text" [(ngModel)]="currentUser.mobileNo" name="mobileNo" class="form-control"
          [readonly]="!isEditing" />
      </div>

      <!-- 🔹 Birth Date Field -->
      <div class="mb-3">
        <label>Birth Date</label>
        <input type="date" [(ngModel)]="currentUser.ubirthDate" name="ubirthDate" class="form-control"
          [readonly]="!isEditing" />
      </div>

      <!-- Action buttons -->
      <div class="mt-3">
        <button *ngIf="!isEditing" type="button" class="btn btn-primary" (click)="enableEdit()">Edit</button>

        <div *ngIf="isEditing">
          <button type="button" class="btn btn-success me-2" (click)="updateUser()">Update Info</button>
          <button type="button" class="btn btn-secondary" (click)="cancelEdit()">Cancel</button>
        </div>
      </div>
    </form>
  </div>
</fieldset>
